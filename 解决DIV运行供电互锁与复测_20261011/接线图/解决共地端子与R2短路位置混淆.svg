<text x="60" y="1319" font-family="Microsoft YaHei,sans-serif" font-size="25" fill="#1c2733">短路路线：VB → SW2 → R3_BOTTOM → SW4 → GND；SW2 闭合后旁路 R3，R3 两端电压约为 0。</text>
<text x="60" y="1367" font-family="Microsoft YaHei,sans-serif" font-size="25" fill="#1c2733">在 1 V 检测阶段，CSV DIV4 预期 VB≈0 mV、VA≈833 mV；实际填写以 ADC 串口报告为准。</text>
<text x="60" y="1413" font-family="Microsoft YaHei,sans-serif" font-size="23" fill="#1c2733">MCU 的 VDDA / VDD / VBAT 接 3.3 V 正电源；它们不接 GND。你的复位上拉电阻现在编号 R4。</text>

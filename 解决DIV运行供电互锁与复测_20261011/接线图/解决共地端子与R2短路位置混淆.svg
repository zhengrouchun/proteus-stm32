<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1460" viewBox="0 0 2200 1460">
<rect width="100%" height="100%" fill="white"/>
<text x="60" y="71" font-family="Microsoft YaHei,sans-serif" font-size="36" fill="#1c2733">解决共地端子与 R2 短路位置混淆：按你最新截图编号标注</text>
<text x="60" y="127" font-family="Microsoft YaHei,sans-serif" font-size="27" fill="#1c2733">你的横向 R2 = CSV 的 R1；你的竖向 R3 = CSV 的 R2。先按位置识别，再操作开关。</text>
<text x="60" y="202" font-family="Microsoft YaHei,sans-serif" font-size="30" fill="#1c2733">这些端子全部接到同一条公共 GND 母线（0 V）</text>
